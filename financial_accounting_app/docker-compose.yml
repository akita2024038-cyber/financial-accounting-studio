services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DATABASE_URL: postgresql+psycopg://accounting:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/accounting
      STORAGE_DIR: /srv/storage
    volumes:
      - excel_data:/srv/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  excel_data:
  pg_data:
